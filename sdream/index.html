<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 외부라이브러리 파일 상단 -->
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="css/swiper-bundle.min.css">
    
    <!-- 내가 직접 코딩하는 하단 -->
    <script src="js/main.js?v=2509171548"></script>
    <link rel="stylesheet" href="css/main.css?v=2509171548">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>삼성꿈장학재단1</title>
</head>
<body>
    <div class="wh"></div>
    <div id="wrap">
        <header></header>
        <main class="container">
            <section class="visual">
                <h2 class="blind">팝업</h2>
                <div class="swiper"> <!-- 팝업의 높이와 넓이를 css에서 줄 수 있는 요소-->
                    <ul class="swiper-wrapper"> <!-- 각 팝업 콘텐츠를 감싸는 요소-->
                        <li class="swiper-slide popup1">
                            <div class="wrapper">
                                <h3 class="tit_gm">내일을 꿈꾸는 <br>이들을 위한 특별한 동행</h3>
                                <p>멘토와 함께 성장하며 잠재력을 발견하고, 자신의 꿈을 찾아가는 여정을 지원합니다</p>
                            </div>
                        </li>
                        <li class="swiper-slide popup2">
                            <div class="wrapper">
                                <h3 class="tit_gm">세상을 바꾸는 힘, <br>사람을 키우는 사랑과 관심</h3>
                                <p>단순한 지원을 넘어, 아이들이 꿈을 펼칠 수 있는 든든한 버팀목이 되겠습니다</p>
                            </div>
                        </li> 
                        <li class="swiper-slide popup3">
                            <div class="wrapper">
                                <h3 class="tit_gm">교육으로 희망을 나누는 <br>글로벌 리더 육성</h3>
                                <p> 멘토와 함께 꿈을 찾고 재능을 개발하며, 미래를 향해 나아갈 수 있도록 지원합니다</p>
                            </div>
                        </li> 
                    </ul>
                </div><!-- swiper -->
                <div class="btn_wrap">
                    <button class="btn_prev"><span class="blind">이전팝업보기</span></button>
                    <button class="btn_play"><span class="blind">다시시작</span></button>
                    <button class="btn_stop"><span class="blind">일시정지</span></button>
                    <button class="btn_next"><span class="blind">다음팝업보기</span></button>
                </div><!-- btn_wrap -->
            </section><!-- visual -->
            <section class="biz">
                
            </section><!-- biz -->
            <section class="notice">
                
            </section><!-- notice -->
            <section class="webzine">
                
            </section><!-- webzine -->
            <section class="service">
                
            </section><!-- service -->
        </main>
        <footer></footer>
    </div><!-- wrap -->
</body>
</html>
